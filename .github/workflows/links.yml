name: links

# Every local href and src in every page must resolve. A renamed asset or a
# moved page is otherwise only found by clicking it on the live site.
# Ported from drsamonline/Hellgate.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # was @v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # was @v4
        with:
          node-version: '20'
      - name: Every local link and asset resolves
        run: node tools/check-links.mjs
