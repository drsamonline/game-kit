name: meta

# The version and licence a repo states must agree with the files that hold them:
# VERSION vs the newest CHANGELOG heading, package.json vs VERSION, LICENSE vs the
# licence the README names. Ported from drsamonline/Hellgate.


on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  meta:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # was @v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # was @v4
        with:
          node-version: '20'
      - name: Version and licence agree with their files
        run: node tools/check-meta.mjs .
