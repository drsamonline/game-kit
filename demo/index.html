<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>game-kit — dodge demo</title>
<style>
  :root{--bg:#0f1115;--card:#171a21;--ink:#e7e9ee;--mut:#9aa3b2;--line:#252a34;--acc:#22c55e}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  header,main,footer{max-width:640px;margin:0 auto;padding:18px}
  canvas{width:100%;background:#0b0e12;border:1px solid var(--line);border-radius:12px;touch-action:none}
  .mut{color:var(--mut)}
  button{background:var(--acc);color:#06210f;border:0;border-radius:10px;padding:9px 13px;font-weight:600;cursor:pointer;margin-top:8px}
</style>
</head>
<body>
<header>
  <h1>game-kit — dodge demo</h1>
  <p class="mut">Move with ← → (or A/D). Dodge the falling blocks. Best score is saved.</p>
</header>
<main>
  <canvas id="c" width="600" height="360"></canvas>
  <p class="mut" id="hud"></p>
  <button id="restart">Restart</button>
</main>
<footer class="mut">© 2026 Dr Sohil Momin · game-kit</footer>
<script src="../game-kit.js"></script>
<script>
  var c = document.getElementById("c"), ctx = c.getContext("2d");
  var hud = document.getElementById("hud");
  var save = Game.save(localStorage, "game-kit-demo");
  var best = (save.read({ best: 0 }) || {}).best || 0;
  var input = Game.input(window);

  var player, blocks, score, spawn, over;
  function reset() {
    player = { x: 280, y: 320, w: 40, h: 16, speed: 320 };
    blocks = []; score = 0; spawn = 0; over = false;
  }
  reset();

  var loop = Game.loop({
    step: 1 / 60,
    update: function (dt) {
      if (over) return;
      if (input.isDown("ArrowLeft") || input.isDown("a")) player.x -= player.speed * dt;
      if (input.isDown("ArrowRight") || input.isDown("d")) player.x += player.speed * dt;
      player.x = Game.clamp(player.x, 0, c.width - player.w);

      spawn -= dt;
      if (spawn <= 0) {
        var w = Game.randInt(24, 60);
        blocks.push({ x: Game.rand(0, c.width - w), y: -20, w: w, h: 18, vy: Game.rand(90, 190) + score * 4 });
        spawn = Math.max(0.25, 0.9 - score * 0.02);
      }
      for (var i = blocks.length - 1; i >= 0; i--) {
        var b = blocks[i];
        b.y += b.vy * dt;
        if (Game.aabb(b, player)) { over = true; if (score > best) { best = score; save.write({ best: best }); } }
        if (b.y > c.height) { blocks.splice(i, 1); score++; }
      }
      input.endFrame();
    },
    render: function () {
      ctx.clearRect(0, 0, c.width, c.height);
      ctx.fillStyle = "#22c55e";
      ctx.fillRect(player.x, player.y, player.w, player.h);
      ctx.fillStyle = "#ef4444";
      blocks.forEach(function (b) { ctx.fillRect(b.x, b.y, b.w, b.h); });
      hud.textContent = "Score " + score + " · Best " + best + (over ? " · GAME OVER (press Restart)" : "");
    }
  });
  loop.start();

  document.getElementById("restart").onclick = function () { reset(); };
</script>

<style>:focus-visible{outline:2px solid currentColor;outline-offset:2px}</style>
<script>
/* THE FOUR THINGS EVERY APP HERE SHOULD HAVE: export, restore, undo, keyboard.
   Hooked at what every app shares - localStorage and document - not at each app's internals,
   so none of them can silently do nothing. */

  window.__exportAll = function () {

    try { for (var i = 0; i < localStorage.length; i++) { var k = localStorage.key(i); if (k && k.indexOf("__") !== 0) out.storage[k] = localStorage.getItem(k); } } catch (e) { out.storageError = String(e); }
    var name = (document.title || "app").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") + "-data-" + new Date().toISOString().slice(0, 10) + ".json";
    var json = JSON.stringify(out, null, 2);
    if (window.Export && typeof Export.save === "function") Export.save(name, json, "application/json");
    else { var a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([json], { type: "application/json" })); a.download = name; document.body.appendChild(a); a.click(); setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1000); }
    return name;
  };
  window.__importAll = function () {
    var inp = document.createElement("input"); inp.type = "file"; inp.accept = ".json,application/json";
    inp.onchange = function () {
      var f = inp.files && inp.files[0]; if (!f) return;
      var r = new FileReader();
      r.onload = function () {
        var data; try { data = JSON.parse(String(r.result)); } catch (e) { alert("That is not a JSON backup."); return; }
        var store = data && (data.storage || data.localStorage || data);
        if (!store || typeof store !== "object") { alert("No stored data found in that file."); return; }
        var keys = Object.keys(store); if (!keys.length) { alert("That backup is empty."); return; }
        if (!confirm("This backup has " + keys.length + " item(s).\n\nRESTORE THEM? This replaces what this app has stored now.")) return;
        keys.forEach(function (k) { var v = store[k]; localStorage.setItem(k, typeof v === "string" ? v : JSON.stringify(v)); });
        alert("Restored " + keys.length + " item(s). Reloading."); location.reload();
      };
      r.readAsText(f);
    };
    inp.click();
  };
  var history = [], orig = localStorage.setItem.bind(localStorage);
  localStorage.setItem = function (k, v) {
    try { var prev = localStorage.getItem(k); if (prev !== String(v) && String(k).indexOf("__") !== 0) { history.push({ k: k, prev: prev }); if (history.length > 60) history.shift(); } } catch (e) {}
    return orig(k, v);
  };
  window.__undo = function () {
    var h = history.pop(); if (!h) { say("Nothing to undo"); return false; }
    try { if (h.prev === null) localStorage.removeItem(h.k); else orig(h.k, h.prev); } catch (e) { say("Could not undo"); return false; }
    say("Undone. Reloading."); setTimeout(function () { location.reload(); }, 350); return true;
  };
  /* The floating cluster, its keyboard overlay and its Ctrl+Z handler were removed by
   the owner: they sat over each app's own controls and fought its own shortcuts.
   The export/import/undo functions above remain callable from an app's own menu. */
})();
</script>

</body>
</html>
